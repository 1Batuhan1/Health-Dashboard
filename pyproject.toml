# Code style is checked with ruff:
#   pip install ruff
#   ruff check .

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W: PEP 8 · F: pyflakes (unused code) · B: common bug patterns · N: naming
select = ["E", "W", "F", "B", "N"]
ignore = [
    "N802",  # method names required by Qt: paintEvent, rowCount, headerData...
    "B008",  # parent=QModelIndex() is the standard Qt idiom
]
